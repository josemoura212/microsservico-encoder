[package]
name = "encoder-rust"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = "0.7"
tracing = { version = "0.1.44", features = ["log", "async-await"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.21.0", features = ["v4", "serde"] }
futures-lite = "2"
google-cloud-storage = { package = "gcloud-storage", version = "1.2.0" }
futures-util = "0.3"
lapin = "2"


[dependencies.sqlx]
version = "0.8.6"
features = [
    "chrono",
    "derive",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
    "sqlite",
]
